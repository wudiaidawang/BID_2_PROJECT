# ============================================================================
# 模型测试配置 — 增删模型只需改这里
# API Key 使用 ${ENV_VAR} 语法从环境变量读取，不落盘
# ============================================================================

# 默认使用的模型
default: "hunyuan"

# 测试参数
test:
  system_prompt: "你是招投标领域专业问答助手。

请严格按照以下格式回答：

【法律依据】
填写相关法律法规名称及条款；若无法确定，填写“暂无明确法条”。

【核心规定】
简要概括核心要求，禁止大段照抄法条原文。

【补充说明】
补充适用场景、限制条件或实践说明；若无可填写“无”。

要求：

1. 禁止联网搜索
2. 禁止调用外部工具
3. 禁止大段引用法条原文
4. 优先使用自己的理解进行概括
5. 回答应简洁，不超过200字
6. 若不确定，请明确说明不确定
7. 不允许编造法律条文

用户问题：
{question}

"
  request_timeout: 60

models:
  # ---------------------------------------------------------------------------
  # 腾讯混元
  # ---------------------------------------------------------------------------
  hunyuan:
    api_url: "https://api.hunyuan.cloud.tencent.com/v1/chat/completions"
    api_key: "${HUNYUAN_API_KEY}"
    model: "hunyuan-standard"
    temperature: 0.3
    max_tokens: 2000

  # ---------------------------------------------------------------------------
  # DeepSeek
  # ---------------------------------------------------------------------------
  deepseek:
    api_url: "https://api.deepseek.com/v1/chat/completions"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    temperature: 0.3
    max_tokens: 2000

  # ---------------------------------------------------------------------------
  # OpenAI
  # ---------------------------------------------------------------------------
  openai:
    api_url: "https://api.openai.com/v1/chat/completions"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4o"
    temperature: 0.3
    max_tokens: 2000

  glm:
    api_url: "https://open.bigmodel.cn/api/paas/v4/chat/completions"
    api_key: "${ZHIPU_API_KEY}"
    model: "glm-4-9b"
    temperature: 0.3
    max_tokens: 2000

